<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新体力テストは、アプリの中で使ってください | CM CLASS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:#f4f2ee;color:#1a1a18;font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;font-size:14px;line-height:1.8;}
body{padding:24px 16px;}
.pf-landing{max-width:560px;margin:32px auto;padding:24px 20px;background:#fff;border:2px solid #9fd4bb;border-radius:12px;}
.pf-landing h1{font-size:20px;margin:0 0 12px;}
.pf-landing p{margin:0 0 12px;}
.pf-landing ol{margin:0 0 16px 1.4em;}
.pf-landing .pf-open{display:inline-block;min-height:44px;line-height:44px;padding:0 24px;background:#1a6b4a;color:#fff;border-radius:8px;text-decoration:none;font-weight:700;}
</style>
</head>
<body>
<!-- v1.59.0 (H4 段階4e): 単体ページ pf.html は案内ページにした。スクリプトは持たず、端末のデータ(記録・名簿)を読みも書きもしない。
     新体力テストの機能・バックアップは index.html(アプリ本体)に一本化されている。sw.js のキャッシュ対象には残す(古いブックマークが開けるように)。 -->
<div class="pf-landing" id="pfLanding">
  <h1>🏃 新体力テストは、アプリの中で使ってください</h1>
  <p>この画面（単体ページ）は、もう使いません。<strong>アプリ内の新体力テストの画面を使ってください。</strong></p>
  <p>新体力テストの記録は、アプリの中に、そのまま入っています。この画面では、記録には何も触れていません。</p>
  <p>アプリを開いたあと、次の順でタップすると新体力テストの画面になります。</p>
  <ol>
    <li>下のボタンでアプリを開く</li>
    <li>【記録】のグループにある「📝」（児童の記録）をタップする</li>
    <li>上の行の「🏃 新体力」をタップする</li>
  </ol>
  <a class="pf-open" id="pfOpenApp" href="./index.html">アプリを開く</a>
</div>
</body>
</html>
